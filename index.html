<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Market Radar</title>
<style>
:root{
  --bg:#0d0f14; --card:#141926; --card2:#1a2030; --line:#212938;
  --fg:#e8eaf0; --dim:#8b93a8; --dim2:#c3cadb;
  --acc:#8fb0ff; --up:#43c98a; --down:#f0666c; --warn:#e8b339;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 90px}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
select{background:var(--card);color:var(--dim2);border:1px solid var(--line);
  border-radius:9px;padding:6px 9px;font-size:12px;max-width:190px}

h1{font-size:23px;line-height:1.28;margin:12px 0 8px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--dim2);margin:0 0 14px;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
.badge.on{color:var(--up)}.badge.off{color:var(--down)}.badge.mix{color:var(--warn)}
.signals{color:var(--dim);font-size:13px;margin:10px 0 0}

nav{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow-x:auto;
  padding:12px 0;margin:16px -16px 4px;padding-left:16px;padding-right:16px;
  background:linear-gradient(var(--bg) 72%,transparent);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--card);color:var(--dim2);border:1px solid var(--line);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;font-family:inherit}
nav button.on{background:var(--acc);color:#0d0f14;border-color:var(--acc);font-weight:650}

.strip{display:flex;gap:9px;overflow-x:auto;padding:4px 0 10px;margin:0 -16px 18px;
  padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.qc{flex:0 0 auto;width:132px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px 8px}
.qc .n{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc .v{font-size:17px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.qc .c{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--dim)}

h2{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);
  margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:650}
.item{margin-bottom:20px}
.fact{font-weight:600;margin-bottom:5px;line-height:1.45}
.why{color:var(--dim2);font-size:15px;margin-bottom:5px}
.impl{color:var(--acc);font-size:14.5px}
.priced{color:var(--warn);font-size:13.5px;font-style:italic;margin-top:3px}
.srcs a{font-size:12px;margin-left:3px;font-weight:600}
a{color:var(--acc);text-decoration:none}

.block{background:var(--card);border-left:3px solid var(--acc);padding:13px 15px;
  margin:12px 0;border-radius:0 var(--r) var(--r) 0}
.block.alert{border-left-color:var(--down)}
.block.warn{border-left-color:var(--warn)}
.mover{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px}
.mover .l{font-size:14px}
.mover .z{font-size:11.5px;color:var(--dim)}
.mover .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}

table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  font-weight:600;text-align:right}
td:first-child,th:first-child{text-align:left;font-variant-numeric:normal}
tbody tr:active{background:var(--card)}

.news{display:block;padding:13px 0;border-bottom:1px solid var(--line)}
.news .t{font-weight:500;line-height:1.45;color:var(--fg);font-size:15px}
.news .m{font-size:12px;color:var(--dim);margin-top:5px}
.pill{display:inline-block;background:var(--card2);border-radius:5px;padding:1px 7px;
  font-size:11px;color:var(--dim);margin-right:6px}

ul{padding-left:20px;margin:8px 0}li{margin-bottom:9px}
.muted{color:var(--dim);font-size:14px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
  color:#616a80;font-size:11.5px;line-height:1.7}
.spark{display:block}
.err{background:#1e1418;border:1px solid #3a2228;border-radius:10px;padding:10px 12px;
  font-size:12.5px;color:#d99;margin-top:14px}
.skel{background:var(--card);border-radius:var(--r);height:16px;margin:10px 0;
  animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.4}50%{opacity:.8}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Market Radar</div>
    <select id="archive" aria-label="Histórico"></select>
  </header>
  <div id="app">
    <div class="skel" style="width:70%;height:26px"></div>
    <div class="skel" style="width:90%"></div>
    <div class="skel" style="width:50%"></div>
  </div>
  <footer id="foot"></footer>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let D = null, TAB = "brief";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = v => typeof v === "number" ? (v > 0 ? "up" : v < 0 ? "down" : "flat") : "flat";
const pct = v => typeof v === "number" ? (v > 0 ? "+" : "") + v.toFixed(2) + "%" : "—";
const num = v => typeof v === "number"
  ? v.toLocaleString("es-CO", {maximumFractionDigits: v < 10 ? 4 : 2}) : "—";

/* ---------- gráfico de línea en SVG, sin librerías ---------- */
function spark(series, w = 116, h = 34) {
  if (!series || series.length < 2) return "";
  const lo = Math.min(...series), hi = Math.max(...series), rng = (hi - lo) || 1;
  const step = w / (series.length - 1);
  const pts = series.map((v, i) => `${(i*step).toFixed(1)},${(h - ((v-lo)/rng)*h).toFixed(1)}`).join(" ");
  const col = series[series.length-1] >= series[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" points="${pts}"/></svg>`;
}

function srcs(idxs) {
  return `<span class="srcs">` + (idxs || []).map(i => {
    const it = (D.items || [])[i - 1];
    return it ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">[${i}]</a>` : "";
  }).join("") + `</span>`;
}

/* ---------- carga ---------- */
async function boot() {
  try {
    const idx = await (await fetch("data/index.json?v=" + Date.now())).json();
    const sel = $("#archive");
    sel.innerHTML = idx.slice(0, 90).map(x =>
      `<option value="${esc(x.file)}">${new Date(x.at).toLocaleString("es-CO",
        {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})} · ${esc(x.regime||"")}</option>`).join("");
    sel.onchange = () => load("data/" + sel.value);
  } catch (e) { /* aún sin archivo */ }
  load("data/latest.json?v=" + Date.now());
}

async function load(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    paint();
  } catch (e) {
    $("#app").innerHTML = `<h1>Todavía no hay briefings</h1>
      <p class="muted">Corre el workflow en GitHub (pestaña Actions → Market Radar →
      Run workflow) o ejecuta <code>python -m src.run demo</code> en tu computador
      para ver un ejemplo.</p>`;
  }
}

/* ---------- vistas ---------- */
function vBrief() {
  const b = D.brief || {}, rg = D.regime || {};
  const k = rg.label === "risk-on" ? "on" : rg.label === "risk-off" ? "off" : "mix";
  let h = `<h1>${esc(b.headline)}</h1>`;
  if (b.subhead) h += `<p class="sub">${esc(b.subhead)}</p>`;
  h += `<span class="badge ${k}">${esc(rg.label)}</span>
        <p class="signals">${esc((rg.signals||[]).join(" · "))}</p>`;
  h += strip();
  if (b.regime_read) h += `<div class="block">${esc(b.regime_read)}</div>`;

  const an = (D.movers||{}).anomalos || [];
  if (an.length) {
    h += `<h2>Movimientos inusuales</h2>`;
    h += an.slice(0,6).map(q => `<div class="mover">
      <div><div class="l">${esc(q.name)}</div>
      <div class="z">z ${q.z>0?"+":""}${q.z} · vol. anual ${q.vol_anual ?? "—"}%</div></div>
      <div class="r ${cls(q.chg_1d)}">${pct(q.chg_1d)}</div></div>`).join("");
  }

  (b.sections||[]).forEach(sec => {
    if (!(sec.items||[]).length) return;
    h += `<h2>${esc(sec.title)}</h2>`;
    sec.items.forEach(it => {
      h += `<div class="item">
        <div class="fact">${esc(it.fact)}${srcs(it.sources)}</div>
        ${it.why ? `<div class="why">${esc(it.why)}</div>` : ""}
        ${it.implication ? `<div class="impl">→ ${esc(it.implication)}</div>` : ""}
        ${it.priced_in ? `<div class="priced">Ya descontado: ${esc(it.priced_in)}</div>` : ""}
      </div>`;
    });
  });

  [["price_action","Lectura del movimiento de precios"],
   ["what_changed","Qué cambió"],
   ["cross_asset","Coherencia entre activos"],
   ["colombia","Colombia"]].forEach(([k2,label]) => {
    if (b[k2]) h += `<h2>${label}</h2><p>${esc(b[k2])}</p>`;
  });

  if ((b.watch_next||[]).length) {
    h += `<h2>Por vigilar</h2>` + b.watch_next.map(w => typeof w === "object"
      ? `<div class="block warn"><b>${esc(w.when)}</b> — ${esc(w.what)}
         <div class="why" style="margin-top:4px">${esc(w.why)}</div></div>`
      : `<div class="block warn">${esc(w)}</div>`).join("");
  }
  if (b.contrarian) h += `<h2>Contra-argumento</h2><div class="block alert">${esc(b.contrarian)}</div>`;
  if (b.learning_note) h += `<h2>Concepto del día</h2><div class="block">${esc(b.learning_note)}</div>`;
  return h;
}

function strip() {
  const keys = ["S&P 500","Nasdaq 100","VIX","DXY","USD/COP","Petróleo WTI","Oro","BTC"];
  const by = {}; (D.quotes||[]).forEach(q => by[q.name] = q);
  const cards = keys.map(k => by[k]).filter(Boolean).map(q => `<div class="qc">
    <div class="n">${esc(q.name)}</div><div class="v">${num(q.last)}</div>
    <div class="c ${cls(q.chg_1d)}">${pct(q.chg_1d)}</div>${spark(q.series, 108, 26)}</div>`);
  (D.macro||[]).slice(0,3).forEach(m => cards.push(`<div class="qc">
    <div class="n">${esc(m.name)}</div><div class="v">${num(m.last)}${esc(m.unit)}</div>
    <div class="c ${cls(m.chg_1d)}">${m.chg_1d>0?"+":""}${m.chg_1d} ${esc(m.delta_unit)}</div>
    ${spark(m.series,108,26)}</div>`));
  return `<div class="strip">${cards.join("")}</div>`;
}

function vMercados() {
  const groups = {
    indices:"Índices", etfs_regionales:"Regiones", etfs_sectoriales:"Sectores",
    renta_fija:"Renta fija", commodities:"Commodities", fx:"Divisas",
    acciones_vigiladas:"Acciones", crypto:"Cripto"
  };
  let h = "";
  Object.entries(groups).forEach(([g, label]) => {
    const rows = (D.quotes||[]).filter(q => q.bucket === g);
    if (!rows.length) return;
    h += `<h2>${label}</h2><table><thead><tr>
      <th>Activo</th><th>Último</th><th>1d</th><th>5d</th><th>YTD</th><th>z</th>
      </tr></thead><tbody>` + rows.map(q => `<tr>
      <td>${esc(q.name)}</td><td>${num(q.last)}</td>
      <td class="${cls(q.chg_1d)}">${pct(q.chg_1d)}</td>
      <td class="${cls(q.chg_5d)}">${pct(q.chg_5d)}</td>
      <td class="${cls(q.chg_ytd)}">${pct(q.chg_ytd)}</td>
      <td class="${q.anomalo?'down':'flat'}">${typeof q.z==="number"?(q.z>0?"+":"")+q.z:"—"}</td>
      </tr>`).join("") + `</tbody></table>`;
  });
  if ((D.macro||[]).length) {
    h += `<h2>Macro y tasas</h2><table><thead><tr>
      <th>Serie</th><th>Nivel</th><th>1d</th><th>1m</th><th>1a</th></tr></thead><tbody>`
      + D.macro.map(m => `<tr><td>${esc(m.name)}</td>
        <td>${num(m.last)}${esc(m.unit)}</td>
        <td class="${cls(m.chg_1d)}">${m.chg_1d>0?"+":""}${m.chg_1d}</td>
        <td class="${cls(m.chg_1m)}">${m.chg_1m>0?"+":""}${m.chg_1m}</td>
        <td class="${cls(m.chg_1y)}">${m.chg_1y>0?"+":""}${m.chg_1y}</td></tr>`).join("")
      + `</tbody></table><p class="muted">Variaciones de tasas en puntos básicos.</p>`;
  }
  return h;
}

function vNoticias() {
  return `<h2>${(D.items||[]).length} noticias priorizadas</h2>` +
    (D.items||[]).map((it,i) => `<a class="news" href="${esc(it.url)}" target="_blank" rel="noopener">
      <div class="t">[${i+1}] ${esc(it.title)}</div>
      <div class="m"><span class="pill">${esc(it.topic)}</span>${esc(it.source)}
      · relevancia ${it.score}${it.n_sources>1?` · ${it.n_sources} fuentes`:""}</div></a>`).join("");
}

function vAgenda() {
  let h = "";
  if ((D.calendar||[]).length) {
    h += `<h2>Calendario económico</h2>` + D.calendar.map(c =>
      `<div class="mover"><div class="l">${esc(c.event)}</div>
       <div class="r" style="font-size:13px">${esc(c.date)}</div></div>`).join("");
  }
  if ((D.ipos||[]).length) {
    h += `<h2>Mercado primario</h2><table><thead><tr>
      <th>Empresa</th><th>Ticker</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>`
      + D.ipos.map(x => `<tr><td>${esc(x.company)}</td><td>${esc(x.ticker||"")}</td>
        <td>${esc(x.status)}</td><td>${esc(x.date||"")}</td></tr>`).join("")
      + `</tbody></table>`;
  }
  if ((D.curve||{}).descomposicion_10y) {
    const c = D.curve.descomposicion_10y;
    h += `<h2>Descomposición del 10 años</h2><div class="block">
      Tasa real ${c.real}% + inflación implícita ${c.inflacion_implicita}%.
      Hoy la real se movió ${c.movimiento_1d_real_pb} pb y el breakeven
      ${c.movimiento_1d_breakeven_pb} pb.</div>`;
  }
  return h || `<p class="muted">Sin agenda disponible en esta corrida.</p>`;
}

function paint() {
  const tabs = {brief:"Briefing", mercados:"Mercados", noticias:"Noticias", agenda:"Agenda"};
  const nav = `<nav>` + Object.entries(tabs).map(([k,v]) =>
    `<button class="${TAB===k?"on":""}" data-tab="${k}">${v}</button>`).join("") + `</nav>`;
  const body = TAB==="brief" ? vBrief() : TAB==="mercados" ? vMercados()
             : TAB==="noticias" ? vNoticias() : vAgenda();
  $("#app").innerHTML = nav + body;
  document.querySelectorAll("nav button").forEach(b =>
    b.onclick = () => { TAB = b.dataset.tab; paint(); window.scrollTo(0,0); });

  const m = (D.brief||{})._meta || {}, errs = D.errors || [];
  $("#foot").innerHTML =
    `Actualizado ${new Date(D.generated_at).toLocaleString("es-CO")}<br>
     ${(D.items||[]).length} noticias · ${(D.quotes||[]).length} activos ·
     modelo ${esc(m.model||"—")} · costo US$${m.cost_usd ?? 0}` +
    (errs.length ? `<div class="err">${errs.length} fuente(s) fallaron:
      ${errs.slice(0,4).map(e => esc(e.source)).join(", ")}</div>` : "");
}
boot();
</script>
</body>
</html>
