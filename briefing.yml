name: Briefing

on:
  schedule:
    # ⚠ GitHub usa hora UTC. Colombia = UTC-5, así que se suman 5 horas.
    - cron: "45 10 * * 1-5"    # 05:45 Colombia — antes de abrir mercados
    - cron: "30 21 * * 1-5"    # 16:30 Colombia — tras el cierre de Nueva York
    - cron: "0 13 * * 6"       # 08:00 Colombia sábado — resumen semanal
  workflow_dispatch:            # botón manual (también desde la app de GitHub)
    inputs:
      modo:
        description: "Tipo de briefing"
        type: choice
        options: [diario, semanal, prueba-sin-enviar]
        default: diario

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar que el código está sano
        run: python -m tests.test_pipeline

      - name: Generar y enviar el briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL:     ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 13 * * 6" ] || [ "${{ inputs.modo }}" = "semanal" ]; then
            python -m src.run run --weekly
          elif [ "${{ inputs.modo }}" = "prueba-sin-enviar" ]; then
            python -m src.run run --local
          else
            python -m src.run run
          fi

      - name: Publicar en el dashboard
        run: |
          git config user.name  "market-radar"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "briefing $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      - name: Avisar si algo falló
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ El briefing falló. Revisa: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
