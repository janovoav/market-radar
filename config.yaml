#  RELEVANCIA DE NOTICIAS
#  Este bloque es el volante del sistema. Si el brief trae ruido, baja un
#  peso aquí. Si algo importante se coló sin aparecer, súbelo. Nunca hay
#  que tocar el prompt para arreglar relevancia.
# ═══════════════════════════════════════════════════════════════════════
scoring:
  tier_weight: {1: 3.0, 2: 1.5, 3: 0.5}
  recency_half_life_hours: 12
  cross_source_bonus: 2.0        # la misma historia en dos fuentes pesa más
  max_items_to_model: 55
  min_score: 1.0

  keywords:
