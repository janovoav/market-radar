# ═══════════════════════════════════════════════════════════════════════
#  MARKET RADAR — archivo de control
#  Todo lo que quieras cambiar del comportamiento del sistema está aquí.
#  El código nunca se toca para ajustar cobertura, pesos o horarios.
# ═══════════════════════════════════════════════════════════════════════

owner:
  name: "Juan Andrés"
  timezone: "America/Bogota"
  language: "es-CO"

  # ─── EL CAMPO MÁS IMPORTANTE DEL ARCHIVO ───
  # Define cómo piensa el analista. Cámbialo cuando cambie tu enfoque.
  mandate: |
    Lector: economista colombiano, analista de administración de pensiones
    (planes DB en EE.UU.), construyendo un proceso de inversión buy-side propio.
    Prepara AMV/CFA. Opera en COP vía XTB, Binance y TRII.

    QUÉ LE INTERESA — en este orden:
    1. Mercados globales transables en general: qué se movió, cuánto y POR QUÉ.
       Le interesa el mercado como objeto de estudio, no solo lo que él posee.
    2. La cadena causal completa: noticia → mecanismo económico → activo afectado.
       Nunca el titular suelto.
    3. Tasas y curvas (UST, TES), porque son el precio del dinero y anclan todo.
    4. El COP y la prima de riesgo de Colombia.
    5. Renta variable global con sesgo a valoración; cripto como sleeve táctico.
    6. Política y geopolítica SOLO en la medida en que muevan precios.

    QUÉ LO ABURRE: titulares sin mecanismo, predicciones sin condición,
    adjetivos de prensa, listas de "acciones para comprar", y repetir lo que
    el mercado ya tenía descontado sin decir que ya estaba descontado.

# ═══════════════════════════════════════════════════════════════════════
#  ENTREGA
# ═══════════════════════════════════════════════════════════════════════
delivery:
  telegram: true
  email: true
  dashboard: true
  max_bullets_in_push: 14      # el push de Telegram se mantiene legible
  send_movers_alert: true      # aviso aparte si algo se mueve de forma anómala

