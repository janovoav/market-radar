# ═══════════════════════════════════════════════════════════════════════
#  DETECCIÓN DE MOVIMIENTOS ANÓMALOS
#  Un movimiento importa si es grande RELATIVO a la volatilidad normal de
#  ese activo. 2% en el S&P es enorme; 2% en bitcoin es un martes cualquiera.
#  Por eso se mide en desviaciones estándar (z-score) de 60 días.
# ═══════════════════════════════════════════════════════════════════════
movers:
  lookback_days: 60
  z_alert: 2.0            # |z| >= 2.0 → se marca como anómalo
  z_strong: 3.0           # |z| >= 3.0 → alerta aparte por Telegram
  top_n: 10               # cuántos movers se le muestran al modelo

